name: Autograding Tests

on:
  push:
    branches: [ "main", "master" ]

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  grade:
    name: Autograding Execution
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Runner & Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      # Test Step 1: Run the student's written unit tests
      - name: Run Student Test Suite
        id: student-tests
        uses: education/autograding-command-grader@v1
        with:
          test-name: Student Unit Tests Execution
          setup-command: ''
          command: 'pytest -v'
          timeout: 1
          max-score: 50

      - name: Autograding Summary Reporter
        uses: education/autograding-grading-reporter@v1
        env:
          STUDENT-TESTS_RESULTS: "${{steps.student-tests.outputs.result}}"
        with:
          runners: student-tests
